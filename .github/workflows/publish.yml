name: publish
# Pushing a tag like v0.1.0 tests, packs and publishes that version to nuget.org and GitHub Packages.
# nuget.org uses Trusted Publishing: no API key is stored. It needs a policy on nuget.org for this
# repository and publish.yml, and the repository variable NUGET_USER set to the nuget.org account name.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test -c Release
      - run: dotnet pack src/Groma -c Release -p:Version=${GITHUB_REF_NAME#v} -o out
      - uses: NuGet/login@v1
        id: nuget
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push out/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }} --skip-duplicate
      - run: dotnet nuget push out/*.nupkg --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
